<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="HÉLIOS·CEP — Projeto Integrador: sistema autônomo de aquecimento solar de piscina, integrando física da radiação, robótica com sensores e programação.">
<title>HÉLIOS·CEP · Radiação Solar e Aquecimento Inteligente</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Unbounded:wght@500;700;900&display=swap" rel="stylesheet">

<style>
/* =========================================
   1. VARIÁVEIS E TEMAS (Design System)
   ========================================= */
:root {
  --bg: #020617; --bg2: #0f172a; --paper: rgba(30, 41, 59, 0.7); 
  --ink: #f8fafc; --ink2: #94a3b8;
  --teal: #2dd4bf; --teal-glow: rgba(45, 212, 191, 0.3);
  --aqua: #38bdf8; --aqua-glow: rgba(56, 189, 248, 0.3);
  --orange: #f97316; --amber: #fbbf24;
  --line: rgba(148, 163, 184, 0.2); 
  --shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.5);
  --f-disp: 'Unbounded', sans-serif; 
  --f-body: 'Space Grotesk', sans-serif; 
  --f-mono: 'Space Mono', monospace;
}

body.hc {
  --bg: #000000; --bg2: #000000; --paper: #000000; 
  --ink: #ffffff; --ink2: #fbbf24;
  --teal: #fbbf24; --teal-glow: transparent;
  --aqua: #fbbf24; --aqua-glow: transparent;
  --orange: #fbbf24; --amber: #fbbf24;
  --line: #ffffff; --shadow: 4px 4px 0 #fbbf24;
}

body.dyslexia {
  --f-body: 'Lexend', sans-serif; --f-disp: 'Lexend', sans-serif; --f-mono: 'Lexend', monospace;
}
body.dyslexia p, body.dyslexia li, body.dyslexia span, body.dyslexia div {
  letter-spacing: 0.05em !important;
  word-spacing: 0.1em !important;
  line-height: 1.8 !important;
}

/* =========================================
   2. RESET E BASE
   ========================================= */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { 
  background: var(--bg); 
  color: var(--ink); 
  font-family: var(--f-body); 
  font-size: 1.06rem; 
  line-height: 1.7; 
  overflow-x: hidden; 
  position: relative;
}

/* Background Animado de Partículas (Fótons) */
.bg-mesh {
  position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: 
    radial-gradient(circle at 15% 50%, rgba(56, 189, 248, 0.08), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(249, 115, 22, 0.08), transparent 25%);
}
.bg-mesh::before {
  content: ''; position: absolute; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2394a3b8' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  animation: meshMove 60s linear infinite;
}
@keyframes meshMove { from { background-position: 0 0; } to { background-position: 100px 100px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .bg-mesh::before { animation: none; }
}

img, svg, canvas { max-width: 100%; display: block; }
a { color: var(--aqua); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--amber); }
:focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; border-radius: 4px; }

.wrap { width: min(1200px, 92%); margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-disp); line-height: 1.15; letter-spacing: -0.02em; }

/* =========================================
   3. ACESSIBILIDADE E UTILITÁRIOS
   ========================================= */
.skip { position: absolute; left: -999px; top: 0; background: var(--amber); color: #000; padding: 1rem 1.5rem; z-index: 9999; font-family: var(--f-mono); font-weight: 700; border-radius: 0 0 8px 0; }
.skip:focus { left: 0; top: 0; }

.progress { position: fixed; top: 0; left: 0; right: 0; height: 4px; background: transparent; z-index: 9998; }
.progress span { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--amber), var(--orange), var(--teal)); transition: width 0.1s linear; box-shadow: 0 0 10px var(--amber); }

.glass-panel {
  background: var(--paper);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: transform 0.3s ease, border-color 0.3s ease;
}
.glass-panel:hover { border-color: var(--aqua); }

.rv { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease, transform 0.8s ease; }
.rv.in { opacity: 1; transform: none; }

/* =========================================
   4. HEADER E NAVEGAÇÃO
   ========================================= */
.topbar { 
  position: sticky; top: 0; z-index: 1000; 
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
  padding: 0.8rem 4%; 
  background: rgba(2, 6, 23, 0.85); 
  backdrop-filter: blur(16px); 
  border-bottom: 1px solid var(--line); 
}
.brand { font-family: var(--f-disp); font-weight: 900; font-size: 1.2rem; color: var(--ink); display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
.brand-sun { width: 24px; height: 24px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 3px var(--bg), 0 0 15px var(--amber); animation: pulse 3s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 3px var(--bg), 0 0 15px var(--amber); } 50% { transform: scale(1.1); box-shadow: 0 0 0 3px var(--bg), 0 0 25px var(--orange); } }
.brand em { font-style: normal; color: var(--aqua); }

.topbar nav { display: flex; gap: 0.2rem; flex-wrap: wrap; margin-inline: auto; }
.topbar nav a { font-family: var(--f-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink2); padding: 0.5rem 0.8rem; border-radius: 8px; transition: all 0.2s; }
.topbar nav a:hover, .topbar nav a.active { background: rgba(255,255,255,0.1); color: var(--ink); }

.a11y-tools { display: flex; gap: 0.4rem; align-items: center; }
.a11y-tools button { 
  font-family: var(--f-mono); font-size: 0.75rem; font-weight: 700; 
  min-width: 40px; min-height: 40px; background: rgba(255,255,255,0.05); 
  border: 1px solid var(--line); border-radius: 8px; cursor: pointer; color: var(--ink); 
  transition: all 0.2s; display: flex; align-items: center; justify-content: center; 
}
.a11y-tools button:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
.a11y-tools button[aria-pressed="true"] { background: var(--amber); color: #000; border-color: var(--amber); }

.hamb { display: none; font-size: 1.5rem; background: transparent; border: none; color: var(--ink); cursor: pointer; }
@media (max-width: 1020px) {
  .hamb { display: block; }
  .topbar nav { display: none; width: 100%; flex-direction: column; border-top: 1px solid var(--line); padding-top: 1rem; margin-top: 0.5rem; }
  .topbar nav.open { display: flex; animation: slideDown 0.3s ease; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
}

/* =========================================
   5. SEÇÕES PRINCIPAIS
   ========================================= */
section { padding: 6rem 0; position: relative; }
.sec-head { margin-bottom: 3rem; text-align: center; max-width: 800px; margin-inline: auto; }
.sec-num { font-family: var(--f-mono); font-size: 0.8rem; letter-spacing: 0.2em; color: var(--orange); display: flex; align-items: center; justify-content: center; gap: 1rem; margin-bottom: 1rem; }
.sec-num::before, .sec-num::after { content: ""; height: 1px; width: 40px; background: var(--orange); opacity: 0.5; }
.sec-head h2 { font-size: clamp(2rem, 5vw, 3.2rem); margin-bottom: 1rem; background: linear-gradient(135deg, var(--ink) 0%, var(--ink2) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.sec-head p.lead { color: var(--ink2); font-size: 1.15rem; }

/* Hero */
.hero { padding: 8rem 0 5rem; text-align: center; overflow: hidden; }
.hero h1 { font-size: clamp(2.5rem, 7vw, 5rem); font-weight: 900; margin-bottom: 1.5rem; line-height: 1.1; }
.hero h1 .sol { color: var(--orange); text-shadow: 0 0 40px rgba(249, 115, 22, 0.3); }
.hero h1 .agua { color: var(--aqua); text-shadow: 0 0 40px rgba(56, 189, 248, 0.3); }
.hero .tagline { font-size: 1.25rem; max-width: 60ch; margin: 0 auto 2.5rem; color: var(--ink2); }
.chips { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin-bottom: 2.5rem; }
.chip { font-family: var(--f-mono); font-size: 0.75rem; padding: 0.5rem 1rem; border: 1px solid var(--line); border-radius: 99px; background: rgba(255,255,255,0.03); color: var(--ink2); display: flex; align-items: center; gap: 0.4rem; }

.btn { 
  display: inline-flex; align-items: center; gap: 0.5rem;
  font-family: var(--f-mono); font-weight: 700; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em;
  padding: 1rem 2rem; border: none; border-radius: 12px; cursor: pointer;
  background: linear-gradient(135deg, var(--amber), var(--orange)); color: #000; 
  box-shadow: 0 10px 30px -10px rgba(249, 115, 22, 0.5); transition: all 0.3s; 
}
.btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px -10px rgba(249, 115, 22, 0.7); }

/* Desafio */
#desafio { background: var(--bg2); }
.desafio-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3rem; align-items: center; }
@media (max-width: 900px) { .desafio-grid { grid-template-columns: 1fr; } }
.questions-list { list-style: none; }
.questions-list li { 
  padding: 1.5rem; background: rgba(255,255,255,0.02); border-left: 4px solid var(--orange); 
  margin-bottom: 1rem; border-radius: 0 12px 12px 0; transition: transform 0.2s; 
}
.questions-list li:hover { transform: translateX(5px); background: rgba(255,255,255,0.04); }
.questions-list li strong { color: var(--amber); display: block; margin-bottom: 0.4rem; font-family: var(--f-mono); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; }

/* Pilares */
.pillars-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
.pillar-card { padding: 2rem; position: relative; overflow: hidden; }
.pillar-card::before { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: var(--accent, var(--aqua)); }
.pillar-card.physics { --accent: var(--orange); }
.pillar-card.robotics { --accent: var(--teal); }
.pillar-card.code { --accent: var(--amber); }
.pillar-card.a11y { --accent: var(--aqua); }
.pillar-icon { font-size: 2.5rem; margin-bottom: 1.2rem; display: block; }
.pillar-card h3 { font-size: 1.2rem; margin-bottom: 0.8rem; color: var(--accent); }
.pillar-card p { font-size: 0.95rem; color: var(--ink2); line-height: 1.6; }

/* =========================================
   6. FÍSICA: ESPECTRO INTERATIVO
   ========================================= */
#fisica { background: var(--bg); }
.spectrum-container { margin-top: 2rem; padding: 2rem; border-radius: 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--line); }
.spectrum-bar { 
  height: 60px; border-radius: 8px; display: flex; overflow: hidden; margin-bottom: 1.5rem; cursor: crosshair;
  background: linear-gradient(90deg, 
    #8a2be2 0%, #8a2be2 15%, /* UV */
    #4169e1 15%, #00ff00 50%, #ff0000 85%, /* Visível */
    #8b0000 85%, #8b0000 100% /* IV */
  );
  position: relative;
}
.spectrum-segment { flex: 1; display: flex; align-items: center; justify-content: center; font-family: var(--f-mono); font-size: 0.8rem; font-weight: 700; color: rgba(255,255,255,0.8); text-shadow: 0 1px 3px rgba(0,0,0,0.8); transition: flex 0.3s ease, filter 0.3s; position: relative; }
.spectrum-segment:hover { flex: 2; filter: brightness(1.2); z-index: 2; }
.spectrum-segment::after { content: attr(data-label); }

.spectrum-info { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center; min-height: 150px; }
.spectrum-text h4 { font-family: var(--f-disp); color: var(--amber); font-size: 1.3rem; margin-bottom: 0.5rem; }
.spectrum-text p { color: var(--ink2); line-height: 1.7; }

/* Animação de Moléculas */
.molecule-box { display: flex; justify-content: center; align-items: center; gap: 1rem; height: 100px; background: rgba(56, 189, 248, 0.05); border-radius: 12px; border: 1px dashed var(--aqua); }
.molecule { width: 20px; height: 20px; background: var(--aqua); border-radius: 50%; box-shadow: 0 0 10px var(--aqua); transition: all 0.5s ease; }
/* A velocidade da animação será controlada via JS inline */
@keyframes vibrate { 
  0%, 100% { transform: translate(0, 0); } 
  25% { transform: translate(2px, -2px); } 
  50% { transform: translate(-2px, 2px); } 
  75% { transform: translate(2px, 2px); } 
}

/* =========================================
   7. SIMULADOR ROBÓTICO AVANÇADO
   ========================================= */
#simulador { background: var(--bg2); }
.sim-grid { display: grid; grid-template-columns: 380px 1fr; gap: 2rem; align-items: start; }
@media (max-width: 1000px) { .sim-grid { grid-template-columns: 1fr; } }

.sim-controls { padding: 1.5rem; }
.sim-controls h3 { font-family: var(--f-disp); margin-bottom: 1.5rem; color: var(--ink); display: flex; align-items: center; gap: 0.5rem; }

.scenario-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-bottom: 1.5rem; }
.scenario-btn { 
  font-family: var(--f-mono); font-size: 0.7rem; padding: 0.6rem; 
  background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 8px; 
  color: var(--ink2); cursor: pointer; transition: all 0.2s; text-align: center; 
}
.scenario-btn:hover { border-color: var(--aqua); color: var(--ink); background: rgba(56, 189, 248, 0.1); }
.scenario-btn.active { background: var(--aqua); color: #000; border-color: var(--aqua); font-weight: 700; }

.control-group { margin-bottom: 1.5rem; }
.control-group label { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.5rem; color: var(--ink2); }
.control-group output { color: var(--amber); font-weight: 700; font-size: 0.9rem; }

input[type=range] { 
  appearance: none; width: 100%; height: 8px; border-radius: 99px; border: 1px solid var(--line);
  background: linear-gradient(90deg, var(--bg), var(--aqua), var(--orange)); cursor: pointer; 
}
input[type=range]::-webkit-slider-thumb { 
  appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; 
  border: 3px solid var(--bg); box-shadow: 0 0 10px rgba(0,0,0,0.5); cursor: grab; transition: transform 0.1s;
}
input[type=range]::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.2); }

.logic-display { 
  background: rgba(0,0,0,0.3); border: 1px solid var(--line); border-radius: 12px; padding: 1.2rem; margin: 1.5rem 0; 
}
.logic-rule { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink2); margin-bottom: 0.5rem; display: block; }
.logic-result { font-family: var(--f-disp); font-size: 1.1rem; font-weight: 700; transition: color 0.3s; }
.logic-result.ok { color: var(--teal); }
.logic-result.fail { color: #f87171; }

.status-lamp { 
  display: flex; align-items: center; gap: 0.8rem; padding: 0.8rem; border-radius: 8px; 
  background: rgba(255,255,255,0.02); border: 1px solid var(--line); margin-bottom: 0.8rem; 
  font-family: var(--f-mono); font-size: 0.85rem; transition: all 0.3s;
}
.status-lamp.on { background: rgba(45, 212, 191, 0.1); border-color: var(--teal); color: var(--teal); }
.status-lamp.on .dot { background: var(--teal); box-shadow: 0 0 10px var(--teal); }
.status-lamp .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--ink2); transition: all 0.3s; }

/* Diagrama SVG e Canvas */
.diagram-container { position: relative; }
.system-diagram { padding: 2rem; display: flex; align-items: center; justify-content: center; min-height: 350px; }
.pipe-flow { opacity: 0.15; transition: opacity 0.4s ease; }
.pipe-flow.active { opacity: 1; animation: flowDash 1s linear infinite; }
@keyframes flowDash { to { stroke-dashoffset: -16; } }
.pump-icon-svg { transform-origin: 260px 180px; transition: transform 0.3s ease; }
.pump-icon-svg.active { animation: spin 1.5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sun-ray { stroke-dasharray: 4; animation: rayMove 1s linear infinite; opacity: 0; transition: opacity 0.5s; }
.sun-ray.active { opacity: 1; }
@keyframes rayMove { to { stroke-dashoffset: -8; } }

.chart-container { margin-top: 1.5rem; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 12px; border: 1px solid var(--line); }
.chart-container h4 { font-family: var(--f-mono); font-size: 0.75rem; color: var(--ink2); margin-bottom: 0.5rem; text-transform: uppercase; }
#tempChart { width: 100%; height: 120px; }

/* =========================================
   8. ACESSIBILIDADE E FOOTER
   ========================================= */
#a11y-info { background: var(--bg); border-top: 1px solid var(--line); }
.a11y-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; }
.a11y-item { padding: 1.5rem; }
.a11y-item h4 { color: var(--teal); margin-bottom: 0.8rem; font-family: var(--f-disp); display: flex; align-items: center; gap: 0.5rem; }
.a11y-item p { font-size: 0.95rem; color: var(--ink2); line-height: 1.6; }

footer { padding: 4rem 0 2rem; background: #01040f; border-top: 1px solid var(--line); text-align: center; color: var(--ink2); font-size: 0.9rem; }
footer nav ul { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; margin: 2rem 0; }
footer nav a { color: var(--ink2); font-family: var(--f-mono); font-size: 0.8rem; }
footer nav a:hover { color: var(--amber); }

[vw] { z-index: 9999 !important; }
</style>
</head>
<body>

<a href="#main-content" class="skip">Pular para o conteúdo principal</a>
<div class="bg-mesh" aria-hidden="true"></div>
<div class="progress" aria-hidden="true"><span id="progressBar"></span></div>

<header class="topbar">
  <a href="#" class="brand">
    <span class="brand-sun" aria-hidden="true"></span>
    HÉLIOS<em>·CEP</em>
  </a>
  <button class="hamb" aria-label="Abrir menu de navegação" aria-expanded="false" onclick="toggleMenu()">☰</button>
  <nav id="mainNav" aria-label="Navegação principal">
    <a href="#desafio">O Desafio</a>
    <a href="#pilares">Pilares</a>
    <a href="#fisica">Física da Radiação</a>
    <a href="#simulador">Simulador IoT</a>
    <a href="#a11y-info">Acessibilidade</a>
  </nav>
  <div class="a11y-tools" role="group" aria-label="Ferramentas de acessibilidade">
    <button onclick="speakPage()" aria-label="Ouvir conteúdo da página" title="Ler em Voz Alta">🔊</button>
    <button onclick="toggleContrast()" aria-label="Alternar alto contraste" aria-pressed="false" title="Alto Contraste">👁️</button>
    <button onclick="toggleDyslexia()" aria-label="Alternar fonte para dislexia" aria-pressed="false" title="Fonte Dislexia">Aa</button>
  </div>
</header>

<main id="main-content">
  <!-- HERO -->
  <section class="hero" id="hero">
    <div class="wrap">
      <div class="rv">
        <div class="chips">
          <span class="chip">⚛️ Física</span>
          <span class="chip">🤖 Robótica</span>
          <span class="chip">💻 Programação</span>
          <span class="chip">♿ WCAG 2.1</span>
        </div>
        <h1>Radiação <span class="sol">Solar</span> e o Aquecimento da <span class
